<section class="container">
  <h2>Saved Designs (Cart)</h2>
  <div id="cartItems"></div>
  <div class="row" style="justify-content:space-between;margin-top:16px">
    <div class="price" id="cartTotal">$0.00</div>
    <div class="row">
      <button class="btn ghost" onclick="LT.clearCart()">Clear Cart</button>
      <button class="btn" onclick="LT.checkout()">Send Inquiry</button>

  </div>
</section>
<section class = "container banner-zone" data-banner-zone="footer-top"></section>

<script src="assets/js/data.js"></script>
<script>window.LT_USE_API = true</script>
<script src="assets/js/app.js"></script>
<script src="assets/js/collections.js"></script>
<script src="assets/js/app_plus_v3.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const link = document.getElementById('navAuth');
    if (!link || !window.LTAuth) return;

    const user = LTAuth.getUser && LTAuth.getUser();
    if (user) {
      // Logged in → show Logout
      link.textContent = 'Logout';
      link.href = '#';
      link.onclick = (e) => {
        e.preventDefault();
        LTAuth.logout();
      };
    } else {
      // Guest → show Login
      link.textContent = 'Login';
      link.href = 'login.html';
      link.onclick = null;
    }
  });
</script>
</body>
</html>
