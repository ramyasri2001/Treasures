<section class="container">
  <h2>Reviews & Testimonials</h2>
  <div id="reviews" class="grid"></div>
  <hr/>
  <h3>Leave a Review</h3>
  <form id="reviewForm" onsubmit="return LT.submitReview(event)">
    <label>Name</label>
    <input class="input" id="r_name" required />
    <label>Rating (1-5)</label>
    <select id="r_rating">
      <option>5</option><option>4</option><option>3</option><option>2</option><option>1</option>
    </select>
    <label>Your review</label>
    <textarea class="input" id="r_text" rows="4" required></textarea>
    <div class="row"><button class="btn" type="submit">Submit</button><small>Reviews require admin approval.</small></div>
  </form>
</section>
